<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Logo JCI Khaznadar</title>
  <!-- Wordmark "JCI" -->
  <g transform="translate(0,0)">
    <text x="0" y="170" font-family="'Poppins', 'Montserrat', sans-serif" font-weight="800"
          font-size="170" fill="#0072BC" transform="skewX(-8)">JCI</text>
  </g>

  <!-- Écusson (shield) avec globe stylisé -->
  <g transform="translate(430,10)">
    <path d="M 75,0
             C 100,0 130,10 150,25
             L 150,112
             C 150,172 115,218 75,262
             C 35,218 0,172 0,112
             L 0,25
             C 20,10 50,0 75,0 Z"
          fill="#ffffff" stroke="#0072BC" stroke-width="12" stroke-linejoin="round"/>
    <g stroke="#0072BC" fill="none">
      <circle cx="75" cy="112" r="46" stroke-width="5"/>
      <ellipse cx="75" cy="112" rx="46" ry="17" stroke-width="3"/>
      <ellipse cx="75" cy="112" rx="17" ry="46" stroke-width="3"/>
      <ellipse cx="75" cy="112" rx="46" ry="17" stroke-width="2" transform="rotate(45 75 112)"/>
      <ellipse cx="75" cy="112" rx="46" ry="17" stroke-width="2" transform="rotate(-45 75 112)"/>
    </g>
    <text x="156" y="22" font-family="'Poppins', sans-serif" font-weight="700" font-size="22" fill="#0072BC">TM</text>
  </g>

  <!-- Mot "Khaznadar" en or, remplace "Tunisie" -->
  <text x="300" y="320" text-anchor="middle" font-family="'Poppins', 'Montserrat', sans-serif"
        font-weight="800" font-size="64" fill="#F2A900">Khaznadar</text>
</svg>
