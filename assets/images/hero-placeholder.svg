<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Photo de couverture à remplacer">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#005EA8"/>
      <stop offset="100%" stop-color="#0072BC"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#heroGrad)"/>
  <g opacity="0.15" fill="#ffffff">
    <circle cx="1300" cy="150" r="220"/>
    <circle cx="150" cy="800" r="260"/>
  </g>
  <g fill="none" stroke="#F2A900" stroke-width="6" opacity="0.9">
    <circle cx="800" cy="420" r="90"/>
    <ellipse cx="800" cy="420" rx="90" ry="32"/>
    <ellipse cx="800" cy="420" rx="32" ry="90"/>
  </g>
  <text x="800" y="600" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700"
        font-size="42" fill="#ffffff">Photo à remplacer — hero-placeholder.svg</text>
  <text x="800" y="650" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="400"
        font-size="26" fill="#E6F1FA">Remplacez par une photo d'action JCI Khaznadar (1600x900px)</text>
</svg>
